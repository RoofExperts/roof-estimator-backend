services:
  - type: web
    name: roof-estimator-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VISION_PROVIDER
        value: anthropic
      - key: VISION_MODEL_ANTHROPIC
        value: claude-opus-4-7
      - key: VISION_MODEL_OPENAI
        value: gpt-4o
      - key: SPEC_PROVIDER
        value: anthropic
      - key: SPEC_MODEL_ANTHROPIC
        value: claude-sonnet-4-6
      - key: SPEC_MODEL_OPENAI
        value: gpt-4o-mini
    runtime:
      pythonVersion: 3.11
